<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0078d4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

    }

  <div class="card">
    <h1>Hello World</h1>
    <p>Deployed via GitHub to Azure Static Web Apps</p>

</html>
